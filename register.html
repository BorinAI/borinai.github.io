<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Borin AI | Registrieren</title>
  
  <link rel="icon" type="image/png" href="media/logo.png">
  <link rel="stylesheet" href="css/style.css"/>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  
  <style>
    .auth-container {
      min-height: calc(100vh - 80px);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 2rem;
      background: radial-gradient(circle at top center, #1e1b4b 0%, #09090b 100%);
    }

    .auth-card {
      background: var(--card-bg);
      padding: 3.5rem;
      border-radius: 28px;
      border: 1px solid var(--glass);
      width: 100%;
      max-width: 500px; /* Synchron zum Login */
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(10px);
    }

    .auth-card h2 {
      font-size: 2.2rem;
      margin-bottom: 0.5rem;
      text-align: center;
      font-weight: 800;
    }

    .auth-card p {
      color: var(--text-muted);
      text-align: center;
      margin-bottom: 2.5rem;
    }

    .auth-form {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      width: 100%;
    }

    .input-group label {
      font-size: 0.85rem;
      color: var(--text-muted);
      font-weight: 600;
      margin-left: 4px;
    }

    .input-group input {
      width: 100%;
      padding: 1rem;
      background: #27272a;
      border: 1px solid var(--glass);
      border-radius: 14px;
      color: white;
      font-size: 1rem;
      outline: none;
      transition: all 0.2s ease;
      box-sizing: border-box; /* Garantiert Symmetrie */
    }

    .input-group input:focus {
      border-color: var(--primary);
      background: #2d2d30;
      box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
    }

    .auth-footer {
      margin-top: 2rem;
      text-align: center;
      font-size: 0.95rem;
      color: var(--text-muted);
    }

    .auth-footer a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 700;
      transition: color 0.2s;
    }

    .auth-footer a:hover {
      color: var(--primary-hover);
    }

    .auth-btn {
      margin-top: 1rem;
      padding: 1rem;
      border: none;
      cursor: pointer;
      font-size: 1rem;
      letter-spacing: 0.02em;
    }
  </style>
</head>
<body>

  <nav class="navbar">
    <a href="index.html" class="logo" style="text-decoration: none;">Borin AI</a>
    <div class="nav-links">
      <a href="login.html" style="color: var(--text-main); text-decoration: none; font-size: 0.9rem; font-weight: 600; margin-right: 1.5rem;">Login</a>
      <a href="chat.html" class="cta" style="padding: 0.5rem 1.25rem; font-size: 0.9rem;">Chat starten</a>
    </div>
  </nav>

  <main class="auth-container">
    <div class="auth-card">
      <h2>Account erstellen</h2>
      <p>Werde Teil der Borin AI Lern-Community.</p>
      
      <form class="auth-form" id="register-form">
        <div class="input-group">
          <label for="username">Benutzername</label>
          <input type="text" id="username" placeholder="Wie sollen wir dich nennen?" required>
        </div>

        <div class="input-group">
          <label for="email">E-Mail Adresse</label>
          <input type="email" id="email" placeholder="name@beispiel.de" required>
        </div>
        
        <div class="input-group">
          <label for="password">Passwort</label>
          <input type="password" id="password" placeholder="Mindestens 8 Zeichen" required>
        </div>
        
        <button type="submit" class="cta auth-btn">Jetzt registrieren</button>
      </form>

      <div class="auth-footer">
        Du hast bereits einen Account? <a href="login.html">Hier anmelden</a>
      </div>
    </div>
  </main>

</body>
</html>
